<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-main: #FAF8F5;
      --surface: #FFFFFF;
      --text-primary: #1A1A1A;
      --text-secondary: #66625D;
      --accent: #4b2107;
      --border: #E8E4DF;
    }

    * {
      box-sizing: border-box;
      min-width: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      width: 100%;
    }

    h1, h2, h3, .serif {
      font-family: 'Playfair Display', serif;
    }

    .nav-link {
      position: relative;
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: var(--text-primary); }

    .icon-chip {
      width: 2.25rem;
      height: 2.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }
    .product-card:active {
      transform: scale(0.98);
    }

    .filter-btn {
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: var(--surface);
      transition: all 0.2s ease;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .filter-btn.active, .filter-btn:active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .field {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      background: var(--surface);
      color: var(--text-primary);
      font-size: 16px;
    }
    .field:focus {
      outline: none;
      border-color: var(--text-primary);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media (max-width: 767px) {
      .desktop-nav { display: none !important; }
    }
    @media (min-width: 768px) {
      .mobile-toggle { display: none !important; }
      .mobile-nav { display: none !important; }
    }
  </style>
</head>
<body class="relative min-h-screen">

  <!-- Background Image with object-contain to prevent zoom/crop -->
  <div class="absolute inset-0 z-0 opacity-25 pointer-events-none flex items-center justify-center">
    <img src="background.webp" alt="Background" class="h-full w-full object-contain">
  </div>

  <!-- Main Content Wrapper -->
  <div class="relative z-10 flex flex-col min-h-screen">
    <!-- Header / Navigation Bar -->
    <header class="sticky top-0 z-40 bg-[var(--bg-main)]/90 backdrop-blur-md border-b border-[var(--border)] px-4 lg:px-8 py-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        <!-- Logo Image -->
        <a href="#home" class="flex items-center gap-2">
          <img src="logo.webp" alt="Logo" class="h-10 w-auto object-contain">
        </a>

        <!-- Desktop Navigation Bar -->
        <nav class="desktop-nav flex items-center gap-8 ml-auto" aria-label="Primary navigation">
          <a class="nav-link text-sm uppercase tracking-widest" href="#home">Home</a>
          <a class="nav-link text-sm uppercase tracking-widest" href="#products">Products</a>
          <a class="nav-link text-sm uppercase tracking-widest" href="#customize">Customize</a>
        </nav>

        <!-- Mobile Nav Toggle Button -->
        <button id="menu-button" class="mobile-toggle icon-chip md:hidden" aria-expanded="false" aria-label="Toggle Menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Mobile Dropdown Navigation -->
      <nav id="mobile-nav" class="mobile-nav hidden flex-col gap-4 pt-4 pb-2 border-t border-[var(--border)] mt-4 md:hidden">
        <a class="mobile-nav-link nav-link text-sm uppercase tracking-widest px-2" href="#home">Home</a>
        <a class="mobile-nav-link nav-link text-sm uppercase tracking-widest px-2" href="#products">Products</a>
        <a class="mobile-nav-link nav-link text-sm uppercase tracking-widest px-2" href="#customize">Customize</a>
      </nav>
    </header>

    <!-- Main Content Section -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-8">
      
      <!-- Controls & Search Bar -->
      <section id="products" class="mb-8">
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between mb-6">
          <input type="text" id="search-input" placeholder="Search handcrafted items..." class="field max-w-md">
          <div class="flex gap-2 overflow-x-auto w-full md:w-auto no-scrollbar pb-2 md:pb-0">
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium active" data-category="all">All</button>
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-category="art">Art</button>
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-category="crafts">Crafts</button>
          </div>
        </div>
        <p id="item-count" class="text-sm text-[var(--text-secondary)]">0 Items Displayed</p>
      </section>

      <!-- Products Grid -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Sample Product Card -->
        <div class="product-card rounded-xl overflow-hidden p-4 flex flex-col justify-between" data-category="art" data-price="50">
          <div class="relative w-full h-64 mb-4 overflow-hidden rounded-lg">
            <img src="product-1.webp" alt="Handcrafted Art" class="w-full h-full object-contain md:object-cover">
          </div>
          <div>
            <h3 class="text-xl font-semibold mb-1">Handcrafted Masterpiece</h3>
            <p class="text-sm text-[var(--text-secondary)] mb-4">$50.00</p>
            <button class="w-full py-2 bg-[var(--accent)] text-white rounded-lg text-sm font-medium hover:opacity-90 transition-opacity" onclick="openProductModal(['product-1.webp', 'product-1-alt1.webp', 'product-1-alt2.webp'], 'Handcrafted Masterpiece', '$50.00')">
              View Details
            </button>
          </div>
        </div>
      </div>

      <div id="no-results" class="hidden text-center py-12 text-[var(--text-secondary)]">
        No items match your selected filters.
      </div>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="handleBackdropClick(event)">
      <div class="bg-[var(--surface)] rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl border border-[var(--border)] flex flex-col">
        <!-- Slideshow Header Container -->
        <div class="relative h-72 bg-[var(--bg-main)] flex items-center justify-center">
          <img id="modal-slideshow-image" src="product-1.webp" alt="Product Preview" class="max-h-full max-w-full object-contain">
          
          <button onclick="prevSlide()" class="absolute left-3 icon-chip shadow-md" aria-label="Previous image">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <button onclick="nextSlide()" class="absolute right-3 icon-chip shadow-md" aria-label="Next image">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
          <span id="modal-slide-indicator" class="absolute bottom-3 right-3 bg-black/70 text-white text-xs px-2.5 py-1 rounded-full">1 / 3</span>
        </div>

        <!-- Modal Body -->
        <div class="p-6">
          <h2 id="modal-title" class="text-2xl font-bold mb-2">Product Title</h2>
          <p id="modal-price" class="text-lg text-[var(--text-secondary)] font-medium mb-6">$0.00</p>
          
          <div class="flex gap-4 items-center">
            <button id="whatsapp-inquire-btn" class="flex-1 py-3 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-medium flex items-center justify-center gap-2 transition-colors">
              <i data-lucide="message-circle" class="w-5 h-5"></i>
              Inquire Now
            </button>
            <button onclick="closeProductModal()" class="px-5 py-3 border border-[var(--border)] rounded-xl hover:bg-gray-50 text-sm font-medium transition-colors">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeCategory = "all";
    let currentImages = [];
    let currentSlideIndex = 0;

    function filterProducts() {
      const search = document.getElementById("search-input").value.toLowerCase();
      const cards = document.querySelectorAll(".product-card");
      const count = document.getElementById("item-count");
      const noResults = document.getElementById("no-results");
      let visible = 0;

      cards.forEach(card => {
        const matchesCategory = activeCategory === "all" || card.dataset.category === activeCategory;
        const matchesSearch = card.textContent.toLowerCase().includes(search);
        const show = matchesCategory && matchesSearch;

        card.classList.toggle("hidden", !show);
        if (show) visible++;
      });

      count.textContent = visible + (visible === 1 ? " Item Displayed" : " Items Displayed");
      noResults.classList.toggle("hidden", visible !== 0);
    }

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        document.querySelectorAll(".filter-btn").forEach(item => item.classList.toggle("active", item === button));
        filterProducts();
      });
    });

    document.getElementById("search-input").addEventListener("input", filterProducts);

    const menuButton = document.getElementById("menu-button");
    const mobileNav = document.getElementById("mobile-nav");

    function toggleMobileNav() {
      const isHidden = mobileNav.classList.toggle("hidden");
      menuButton.setAttribute("aria-expanded", String(!isHidden));
    }

    menuButton.addEventListener("click", toggleMobileNav);

    document.querySelectorAll(".mobile-nav-link").forEach(link => {
      link.addEventListener("click", () => {
        if (!mobileNav.classList.contains("hidden")) {
          toggleMobileNav();
        }
      });
    });

    function openProductModal(images, title, price) {
      currentImages = images && images.length ? images : ['product-1.webp'];
      currentSlideIndex = 0;
      
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-price').textContent = price;
      
      const whatsappBtn = document.getElementById('whatsapp-inquire-btn');
      const message = `Hello, I am interested in inquiring about "${title}" priced at ${price}.`;
      whatsappBtn.onclick = () => {
        window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
      };

      updateSlideshow();
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('product-modal').classList.add('hidden');
    }

    function handleBackdropClick(event) {
      if (event.target === document.getElementById('product-modal')) {
        closeProductModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeProductModal();
      }
    });

    function updateSlideshow() {
      const imgElement = document.getElementById('modal-slideshow-image');
      const indicator = document.getElementById('modal-slide-indicator');

      imgElement.src = currentImages[currentSlideIndex];
      indicator.textContent = `${currentSlideIndex + 1} / ${currentImages.length}`;
    }

    function nextSlide() {
      currentSlideIndex = (currentSlideIndex + 1) % currentImages.length;
      updateSlideshow();
    }

    function prevSlide() {
      currentSlideIndex = (currentSlideIndex - 1 + currentImages.length) % currentImages.length;
      updateSlideshow();
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
      filterProducts();
    });
  </script>
</body>
</html>
